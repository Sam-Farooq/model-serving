name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check src tests train loadtest
      - run: pytest -q --tb=short

  smoke:
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[dev]"
      # sqlite, not a file store. MLflow now raises on the filesystem backend
      # rather than warning, so file:// fails outright. sqlite needs no server
      # and is what MLflow points you at.
      - run: MS_MLFLOW_URI=sqlite:///$RUNNER_TEMP/mlflow.db python train/train.py --epochs 3
