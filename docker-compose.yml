services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5}

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    ports: ["5000:5000"]
    volumes: ["mlruns:/mlruns"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4317:4317"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./grafana:/etc/grafana/provisioning/dashboards:ro"]
    ports: ["3000:3000"]

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MS_REDIS_URL: redis://redis:6379/0
      MS_MLFLOW_URI: http://mlflow:5000
      MS_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["celery", "-A", "serving.tasks", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      MS_REDIS_URL: redis://redis:6379/0
      MS_MLFLOW_URI: http://mlflow:5000
    depends_on:
      redis: {condition: service_healthy}

volumes:
  mlruns:
