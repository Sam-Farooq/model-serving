[project]
name = "model-serving"
version = "2.1.0"
description = "Async PyTorch inference with MLflow registry, Celery offload and OpenTelemetry"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "locust==2.46.7", "ruff==0.16.10"]

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
asyncio_mode = "auto"
